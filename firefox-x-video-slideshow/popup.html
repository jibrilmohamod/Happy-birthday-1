<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { width: 290px; margin: 0; padding: 14px; background: #0f1419; color: #e7eef2; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    h1 { margin:0; font-size:16px; font-weight:750; }
    .state { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border-radius:999px; background:#171e24; color:#9fb6c3; font-size:11px; font-weight:700; }
    .dot { width:7px; height:7px; border-radius:50%; background:#536471; }
    .state.active { color:#b7e3c6; background:rgba(0,186,124,.1); }
    .state.active .dot { background:#00ba7c; box-shadow:0 0 0 3px rgba(0,186,124,.12); }
    #toggle { width:100%; min-height:44px; border:0; border-radius:13px; background:#1d9bf0; color:#06131b; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 10px 24px rgba(29,155,240,.24); }
    #toggle.stop { background:#202327; color:#f7f9f9; box-shadow:none; border:1px solid rgba(255,255,255,.1); }
    #toggle:disabled { opacity:.55; cursor:default; }
    .panel { margin-top:12px; padding:12px; border:1px solid rgba(255,255,255,.08); border-radius:13px; background:#111820; }
    .panel-title { margin:0 0 10px; color:#8fa5b2; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px; }
    .label { font-size:13px; font-weight:650; }
    .sub { display:block; margin-top:2px; color:#78909c; font-size:10px; font-weight:500; }
    .switch { position:relative; width:42px; height:24px; flex:0 0 auto; }
    .switch input { position:absolute; opacity:0; inset:0; }
    .track { position:absolute; inset:0; border-radius:999px; background:#27313a; border:1px solid rgba(255,255,255,.1); cursor:pointer; }
    .track::after { content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; border-radius:50%; background:#e7eef2; transition:transform .14s ease; }
    .switch input:checked + .track { background:#1d9bf0; border-color:#1d9bf0; }
    .switch input:checked + .track::after { transform:translateX(18px); }
    .switch input:disabled + .track { opacity:.45; cursor:default; }
    #intervalRow { display:none; padding-top:8px; margin-top:6px; border-top:1px solid rgba(255,255,255,.06); }
    #intervalRow.visible { display:flex; }
    select { border:1px solid rgba(255,255,255,.1); border-radius:9px; background:#182129; color:#e7eef2; padding:6px 8px; font-size:12px; }
    #status { min-height:30px; margin-top:10px; padding:8px 10px; border-radius:10px; background:#111820; color:#9fb6c3; font-size:11px; line-height:1.35; }
    .keys { margin-top:10px; color:#68808d; font-size:10px; line-height:1.45; text-align:center; }
    kbd { padding:1px 4px; border:1px solid rgba(255,255,255,.1); border-radius:4px; background:#182129; color:#afc2cc; font-size:9px; }
  </style>
</head>
<body>
  <div class="header"><h1>X Video Slideshow</h1><div id="state" class="state"><span class="dot"></span><span id="stateText">Ready</span></div></div>
  <button id="toggle">Start slideshow</button>
  <div class="panel">
    <div class="panel-title">Media</div>
    <div class="row"><div><span class="label">Include images</span><span class="sub">Mix tweet photos into feed order</span></div><label class="switch"><input id="includeImages" type="checkbox" /><span class="track"></span></label></div>
    <div id="intervalRow" class="row"><span class="label">Image duration</span><select id="imageInterval"><option value="2">2 sec</option><option value="3" selected>3 sec</option><option value="5">5 sec</option><option value="8">8 sec</option><option value="10">10 sec</option></select></div>
  </div>
  <div id="status">Open X/Twitter and start the slideshow.</div>
  <div class="keys"><kbd>←</kbd>/<kbd>→</kbd> navigate · <kbd>Space</kbd> play · <kbd>L</kbd> like · <kbd>R</kbd> repost · <kbd>B</kbd> bookmark</div>
  <script src="popup.js"></script>
</body>
</html>
