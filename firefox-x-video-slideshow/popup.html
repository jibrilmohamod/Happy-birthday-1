<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { min-width: 250px; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; margin: 0; background: #0f1419; color: #e8f0f4; }
      h3 { margin: 0 0 12px; font-weight: 700; letter-spacing: .2px; }
      #toggle { width: 100%; margin-top: 4px; padding: 12px; cursor: pointer; border: none; border-radius: 12px; background: linear-gradient(120deg, #1d9bf0, #58c1ff); color: #0b0f12; font-weight: 700; font-size: 14px; box-shadow: 0 12px 24px rgba(29,155,240,.35); transition: transform 120ms ease, box-shadow 160ms ease, filter 120ms ease; }
      #toggle:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(29,155,240,.45); filter: brightness(1.05); }
      #toggle:active { transform: translateY(0); }
      #toggle.stop { background: #202327; color: #e8f0f4; box-shadow: none; border: 1px solid rgba(255,255,255,.12); }
      .option-panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }
      .option-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .option-label { font-size: 13px; font-weight: 600; }
      .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
      .switch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
      .switch-track { position: absolute; inset: 0; border-radius: 999px; background: #27313a; border: 1px solid rgba(255,255,255,.12); transition: background 140ms ease,border-color 140ms ease; }
      .switch-track::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: #e8f0f4; transition: transform 140ms ease; }
      .switch input:checked + .switch-track { background: #1d9bf0; border-color: #1d9bf0; }
      .switch input:checked + .switch-track::after { transform: translateX(18px); }
      .interval-row { display: none; margin-top: 10px; align-items: center; justify-content: space-between; gap: 10px; }
      .interval-row.visible { display: flex; }
      .interval-row label { font-size: 12px; color: #9fb6c3; }
      #imageInterval { min-width: 96px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: #151c22; color: #e8f0f4; padding: 6px 8px; font-size: 12px; }
      #status { margin-top: 8px; min-height: 16px; font-size: 12px; color: #9fb6c3; }
    </style>
  </head>
  <body>
    <h3>X Video Slideshow</h3>
    <button id="toggle">Start Overlay Slideshow</button>
    <div class="option-panel">
      <div class="option-row">
        <span class="option-label">Include images</span>
        <label class="switch" title="Include tweet images in the slideshow"><input id="includeImages" type="checkbox" /><span class="switch-track"></span></label>
      </div>
      <div id="intervalRow" class="interval-row">
        <label for="imageInterval">Image interval</label>
        <select id="imageInterval"><option value="2">2 seconds</option><option value="3" selected>3 seconds</option><option value="5">5 seconds</option><option value="8">8 seconds</option><option value="10">10 seconds</option></select>
      </div>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
